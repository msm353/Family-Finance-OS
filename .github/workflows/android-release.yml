name: Android beta release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-release]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android
      - name: Prepare release signing key
        env:
          FFOS_KEYSTORE_BASE64: ${{ secrets.FFOS_KEYSTORE_BASE64 }}
          FFOS_KEYSTORE_PASSWORD: ${{ secrets.FFOS_KEYSTORE_PASSWORD }}
          FFOS_KEY_ALIAS: ${{ secrets.FFOS_KEY_ALIAS }}
          FFOS_KEY_PASSWORD: ${{ secrets.FFOS_KEY_PASSWORD }}
        run: |
          for variable in FFOS_KEYSTORE_BASE64 FFOS_KEYSTORE_PASSWORD FFOS_KEY_ALIAS FFOS_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing required Android signing secret: $variable" >&2
              exit 1
            fi
          done
          printf '%s' "$FFOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ffos-release.jks"
          echo "FFOS_KEYSTORE_PATH=$RUNNER_TEMP/ffos-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          FFOS_KEYSTORE_PASSWORD: ${{ secrets.FFOS_KEYSTORE_PASSWORD }}
          FFOS_KEY_ALIAS: ${{ secrets.FFOS_KEY_ALIAS }}
          FFOS_KEY_PASSWORD: ${{ secrets.FFOS_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Publish APK on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          gh release create "$tag" "$apk#FFOS-$tag.apk" \
            --target "$GITHUB_SHA" \
            --title "FFOS $tag (Android beta)" \
            --notes-file docs/RELEASE-0.1.2-beta.md \
            --prerelease
