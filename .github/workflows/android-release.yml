name: Android beta release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-release]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$tag" "$apk#FFOS-$tag.apk" \
            --target "$GITHUB_SHA" \
            --title "FFOS $tag (Android beta)" \
            --notes-file docs/RELEASE-0.1.2-beta.md \
            --prerelease
